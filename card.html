<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card UI Design</title>
    <link rel="stylesheet" href="card.css" />

    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <video autoplay muted loop id="bg-video">
      <source src="assets/Video Background.mp4" type="video/mp4" />
    </video>

    <div class="profile-card">
      <div class="image">
        <img src="profile2.jpg" alt="" class="profile-img" />
      </div>

      <div class="text-data">
        <span class="name"> Jesse Macharia Mwangi </span>
        <span class="job"> Software Engineer </span>
      </div>

      <div class="media-buttons">
        <div class="media-item">
          <a href="https://github.com/gitdajesse" id="github">
            <i class="bx bxl-github"></i>
          </a>
          <span> GitHub </span>
        </div>

        <div class="media-item">
          <a href="https://www.linkedin.com/in/jessemwangi-it/" id="linkedin">
            <i class="bx bxl-linkedin"></i>
          </a>
          <span> LinkedIn </span>
        </div>

        <div class="media-item">
          <a href="mailto:jessemasha05@gmail.com" id="email">
            <i class="bx bxs-envelope"></i>
          </a>
          <span> Email </span>
        </div>
      </div>

      <div class="button-1">
        <form action="https://www.google.com/">
          <button type="submit" id="website">Check Out My Website!</button>
        </form>
      </div>

      <!--Instagram-->
      <div class="analytics">
        <!--GitHub-->
        <div class="data">
          <i class="bx bx-code-alt"></i>
          <span class="number">1.1K</span>
        </div>

        <!--LinkedIn-->
        <div class="data">
          <i class="bx bx-briefcase-alt"></i>
          <span class="number">500+</span>
        </div>

        <!--WhatsApp-->
        <div class="data">
          <i class="bx bx-message-rounded"></i>
          <span class="number">10+</span>
        </div>
      </div>
    </div>
  </body>
</html>
